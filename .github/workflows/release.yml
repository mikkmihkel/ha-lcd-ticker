name: Release

on:
  push:
    tags:
      - v*.*.*

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - run: python -c "import json,sys,os; v=json.load(open('custom_components/lcd_ticker/manifest.json'))['version']; t=os.environ['GITHUB_REF_NAME'].lstrip('v'); sys.exit(0 if v==t else f'manifest {v} != tag {t}')"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: pytest -q
      - run: |
          VER=$(echo "$TAG" | sed 's/^v//')
          awk -v ver="$VER" '$0 ~ /^## \[/ { if (found) exit; if ($0 ~ "## \\[" ver "\\]") { found=1; next } } found { print }' CHANGELOG.md > notes.md
        env:
          TAG: ${{ github.ref_name }}
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
