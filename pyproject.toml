[project]
name = "ha-lcd-ticker"
version = "0.1.2"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.lcd_ticker"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.lcd_ticker"]
combine-as-imports = true
